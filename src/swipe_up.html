<html>
  <head>
    <title>Swipe Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: sans-serif;
        background-image: linear-gradient(rgba(153, 202, 248, 0.65), rgba(255, 255, 255, 1));
        position: relative;
      }
      .center-screen {
        text-align: center;
        background: #ffffff;
        height: 26em;
        width: 70%;
        max-width: 26em;
        max-height: 70%;
        margin: auto;
        padding: 1em;
        border-radius: 1.4em;
        position: absolute;
        bottom: 0; right: 0;left: 0;
        overflow: hidden;
      }

      @keyframes bounceAnimation {
        0%, 100% { transform: translateY(230px); }
        50% { transform: translateY(0px); }
      }

      #arrow {
        width: 20em;
        height: 20em;
        max-width: 60%;
        max-height: 60%;
        margin: 1em auto;
        animation-name: bounceAnimation;
        animation-duration: 2.5s;
        animation-timing-function: ease;
        animation-iteration-count: infinite;
        animation-direction: normal;
        animation-fill-mode: both;
        position: relative;
      }

      #arrow svg {
        fill: #3A63AE;
        stroke: #000000;
        stroke-width: 10px;
      }
    </style>
  </head>
  <body>
    <div class="center-screen">
      <h1>Login Successful!</h1>
      <p>Swipe up from bottom of screen to start using iPad.</p>
      <p>Tap XCreds Mobile when done.</p>

      <div id="arrow">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM337 199L417 279C426.4 288.4 426.4 303.6 417 312.9C407.6 322.2 392.4 322.3 383.1 312.9L344.1 273.9L344.1 424C344.1 437.3 333.4 448 320.1 448C306.8 448 296.1 437.3 296.1 424L296.1 273.9L257.1 312.9C247.7 322.3 232.5 322.3 223.2 312.9C213.9 303.5 213.8 288.3 223.2 279L303.2 199C312.6 189.6 327.8 189.6 337.1 199z"/></svg>
      </div>
    </div>
  </body>
</html>
